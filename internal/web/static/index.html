<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HomeNVR</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>HomeNVR</h1>
  <nav>
    <button class="tab active" data-tab="status">Status</button>
    <button class="tab" data-tab="recordings">Recordings</button>
    <button class="tab" data-tab="logs">Logs</button>
    <button class="tab" data-tab="config">Config</button>
  </nav>
  <a class="live" target="_blank" rel="noopener" href="#" id="live-link">Live view</a>
</header>

<main>
  <section id="tab-status" class="panel active"></section>
  <section id="tab-recordings" class="panel">
    <div id="rec-list"></div>
    <video id="player" controls hidden></video>
  </section>
  <section id="tab-logs" class="panel">
    <div class="card">
      <div class="toolbar">
        <select id="log-name">
          <option value="service">service.log</option>
          <option value="alert">alert.log</option>
          <option value="go2rtc">go2rtc.out.log</option>
          <option value="go2rtc.err">go2rtc.err.log</option>
        </select>
        <button id="log-refresh" class="secondary">Refresh</button>
        <span id="log-msg"></span>
      </div>
      <pre id="log-view" class="log"></pre>
    </div>
  </section>
  <section id="tab-config" class="panel">
    <div class="toolbar sticky-toolbar">
      <div class="toolbar-left">
        <button id="cfg-save">Save &amp; reload</button>
        <button id="cfg-reload" class="secondary">Revert</button>
        <span id="unsaved-dot" class="unsaved-dot" hidden title="Unsaved changes"></span>
        <span id="cfg-msg"></span>
      </div>
      <div class="toolbar-right">
        <button id="cfg-export" class="secondary toggle-btn" onclick="">Export</button>
        <button id="cfg-import" class="secondary toggle-btn" onclick="">Import</button>
        <div class="view-toggle">
          <button id="cfg-view-form" class="toggle-btn active" onclick="">Form</button>
          <button id="cfg-view-raw" class="toggle-btn" onclick="">Raw</button>
        </div>
        <button id="cfg-adv-toggle" class="secondary toggle-btn" onclick="">Advanced</button>
      </div>
    </div>
    <div id="cfg-form"></div>
    <div id="cfg-text-wrap" hidden>
      <textarea id="cfg-text" spellcheck="false"></textarea>
    </div>
  </section>
</main>

<script src="/app.js"></script>
</body>
</html>
